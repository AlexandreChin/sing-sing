<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
{% include 'base.css' %}
{% include 'article_carousel_cadrage_v1/_argument.css' %}
{% include 'article_carousel_anatomie_chiffre_v1/_cards.css' %}
</style>
</head>
<body>
<div class="slide" style="justify-content: flex-start;">
  <div class="slide-watermark">{{ '%02d'|format(slide_n) }}</div>
  {% include '_brand.html' %}
  <div class="stage">
    <span class="kick"><svg viewBox="0 0 24 24">{{ ICONS.hierarchy | safe }}</svg>Les alternatives</span>
    <h1 class="head">{{ title | md_bold }}</h1>
    {% for r in rows %}<div class="card">
      <div class="pt"><svg viewBox="0 0 24 24">{{ ICONS[icons[loop.index0]] | safe }}</svg><div>
        <div class="nm">{{ r.nom | md_bold }}</div>
        <div class="see">{{ r.voir | md_bold }}</div>
      </div></div>
      <div class="foot"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><span>{{ r.sens | md_bold }}</span></div>
    </div>{% endfor %}
  </div>
  <div class="slide-num">{{ slide_n }} / {{ slide_total }}</div>
  <div class="progress-track"><div class="progress-bar" style="width: {{ progress }}%;"></div></div>
</div>
</body>
</html>
