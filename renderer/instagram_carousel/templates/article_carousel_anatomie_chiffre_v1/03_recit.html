<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
{% include 'base.css' %}
{% include 'article_carousel_cadrage_v1/_argument.css' %}
/* from the figure to the story: one row per step, tagged by what kind of statement it is */
.card.rows { padding: 8px 30px; }
.row { padding: 20px 0; }
.row + .row { border-top: 1px solid #2c2c2c; }
.row .kind { display: inline-block; font-size: 22px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #d4aa00; }
.row.donnee .kind { color: #0a0a0a; background: #d4aa00; padding: 2px 12px; border-radius: 999px; }
.row .t { margin-top: 8px; font-size: 29px; font-weight: 700; line-height: 1.25; color: #fff; text-wrap: pretty; hyphens: none; }
.row .t strong { color: #d4aa00; font-weight: 700; }
.row .b { margin-top: 6px; font-size: 25px; font-weight: 500; line-height: 1.3; color: #a0a0a0; }
</style>
</head>
<body>
<div class="slide" style="justify-content: flex-start;">
  <div class="slide-watermark">{{ '%02d'|format(slide_n) }}</div>
  {% include '_brand.html' %}
  <div class="stage">
    <span class="kick"><svg viewBox="0 0 24 24">{{ ICONS.book | safe }}</svg>Le récit</span>
    <h1 class="head">{{ title | md_bold }}</h1>
    <div class="card rows" data-perch>{% include '_perch.html' %}
      {% for r in rows %}<div class="row {{ r.kind }}">
        <span class="kind">{{ labels[r.kind] }}</span>
        <div class="t">{{ r.text | md_bold }}</div>
        {% if r.basis %}<div class="b">{{ r.basis | fr }}</div>{% endif %}
      </div>{% endfor %}
    </div>
  </div>
  <div class="slide-num">{{ slide_n }} / {{ slide_total }}</div>
  <div class="progress-track"><div class="progress-bar" style="width: {{ progress }}%;"></div></div>
</div>
</body>
</html>
